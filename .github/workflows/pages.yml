name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish the site only: the generator and README stay out of it.
      - name: Stage site
        run: |
          mkdir _site
          cp index.html style.css app.js .nojekyll _site/
          cp -r data _site/
          # Stamp the commit onto the asset URLs so a phone holding a cached
          # app.js can never pair it with a newer index.html.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
          grep -o '\(app\.js\|style\.css\)?v=[0-9a-f]*' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
